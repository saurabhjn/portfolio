{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
        <h1 class="mb-4">{{ title }}</h1>
        {% include 'form.html' %}
    </div>
</div>

{% if form.__class__.__name__ == 'ExpenseForm' %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const isRecurringCheck = document.getElementById('is_recurring');
        const periodField = document.getElementById('recurrence_period').closest('.mb-3');
        const endDateField = document.getElementById('end_date').closest('.mb-3');

        function toggleRecurringFields() {
            if (isRecurringCheck.checked) {
                periodField.style.display = 'block';
                endDateField.style.display = 'block';
            } else {
                periodField.style.display = 'none';
                endDateField.style.display = 'none';
            }
        }

        isRecurringCheck.addEventListener('change', toggleRecurringFields);
        toggleRecurringFields(); // Initial state
    });
</script>
{% endif %}

{% if form.__class__.__name__ == 'TransactionForm' %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const buyQty = document.getElementById('buy_quantity');
        const sellQty = document.getElementById('sell_quantity');
        if (!buyQty || !sellQty) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-sm btn-outline-secondary mt-1';
        btn.textContent = 'Same as buy quantity';
        btn.addEventListener('click', function () {
            if (buyQty.value !== '') {
                sellQty.value = buyQty.value;
                sellQty.dispatchEvent(new Event('input', { bubbles: true }));
            }
        });

        sellQty.insertAdjacentElement('afterend', btn);
    });
</script>
{% endif %}
{% endblock %}
